name: Sync editorial spreadsheet drafts
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1-5'
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/development/library-launch-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/library-launch-build
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch approved-for-draft spreadsheet rows
        env:
          SHEET_ID: 1E8gt43-a7PU5spdSbKBdz544Wm7nYsB0E643LiqoEfE
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
        run: node scripts/sync-sheet-drafts.mjs
      - name: Validate conversion and draft isolation
        run: |
          node --test scripts/import-profile.test.mjs
          node scripts/check-draft-isolation.mjs
      - name: Commit development drafts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/drafts/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh spreadsheet editorial drafts"
            git push origin HEAD:development/library-launch-build
          fi
