name: Sync editorial spreadsheet drafts
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/development/library-launch-build'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: development/library-launch-build
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fetch in-review spreadsheet rows
        env:
          SHEET_ID: 1UrhfwQa8U-Obx-dOX_PyfTt882adIgpm7uG6ysv23UI
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-sheet-drafts.mjs
      - name: Validate conversion and draft isolation
        run: |
          node --test scripts/import-profile.test.mjs
          node scripts/check-draft-isolation.mjs
      - name: Automated editorial QA and report
        id: qa
        continue-on-error: true
        run: node scripts/qa-editorial-drafts.mjs
      - name: Upload QA findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-qa-report
          path: qa-results/
          if-no-files-found: warn
      - name: Commit development drafts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/drafts/ preview/drafts/ preview/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh spreadsheet editorial drafts"
            git push origin HEAD:development/library-launch-build
          fi
      - name: Report QA blockers
        if: steps.qa.outcome == 'failure'
        run: |
          echo "Automated QA found blocking errors. Review editorial-qa-report."
          exit 1
