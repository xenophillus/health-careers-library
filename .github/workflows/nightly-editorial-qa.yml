name: Nightly editorial QA (unpublished drafts)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: write
jobs:
  editorial-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out isolated development branch
        uses: actions/checkout@v5
        with:
          ref: development/library-launch-build
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read editorial spreadsheet and regenerate unpublished previews
        env:
          SHEET_ID: 1UrhfwQa8U-Obx-dOX_PyfTt882adIgpm7uG6ysv23UI
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-sheet-drafts.mjs
      - name: Build integrated unpublished career library
        run: node scripts/build-review-library.mjs
      - name: Validate draft conversion and production isolation
        run: |
          node --test scripts/import-profile.test.mjs
          node scripts/check-draft-isolation.mjs
      - name: Produce editorial QA report
        id: qa
        continue-on-error: true
        run: node scripts/qa-editorial-drafts.mjs
      - name: Audit duplicate careers, pathways and image readiness
        id: integration
        continue-on-error: true
        run: node scripts/audit-career-integration.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local unpublished preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hcl-preview.log 2>&1 &
          for n in {1..30}; do curl -fsS http://127.0.0.1:4173/preview/ >/dev/null && break; sleep 1; done
      - name: Run browser tests on desktop and mobile
        id: browser
        continue-on-error: true
        run: node scripts/qa-browser-drafts.mjs
      - name: Test integrated development library and capture screenshots
        id: library
        continue-on-error: true
        run: node scripts/qa-integrated-library.mjs
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-qa-report
          path: qa-results/
          if-no-files-found: warn
      - name: Commit regenerated previews to development only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/drafts/ preview/drafts/ preview/styles.css preview/library.html preview/assets/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh unpublished editorial drafts"
            git push origin HEAD:development/library-launch-build
          fi
      - name: Fail on structural or browser QA errors
        if: steps.qa.outcome == 'failure' || steps.browser.outcome == 'failure' || steps.integration.outcome == 'failure' || steps.library.outcome == 'failure'
        run: exit 1
