name: Career profile structure checks
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'docs/launch-careers.json'
      - 'scripts/assessment*'
      - 'scripts/build-career-map.mjs'
      - 'scripts/validate-profiles*'
      - '.github/workflows/profile-check.yml'
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'index.html'
      - 'docs/launch-careers.json'
      - 'scripts/assessment*'
      - 'scripts/build-career-map.mjs'
      - 'scripts/validate-profiles*'
      - '.github/workflows/profile-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-profiles.mjs
      - run: node --test scripts/*.test.mjs
