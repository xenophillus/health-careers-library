name: Career profile structure checks
on:
  pull_request:
    paths:
      - 'assets/data/**'
      - 'scripts/validate-profiles*'
      - 'scripts/import-profile*'
      - 'scripts/check-draft-isolation.mjs'
      - '.github/workflows/profile-check.yml'
  push:
    branches: [main, development/library-launch-build]
    paths:
      - 'assets/data/**'
      - 'scripts/validate-profiles*'
      - 'scripts/import-profile*'
      - '.github/workflows/profile-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-draft-isolation.mjs
      - run: node scripts/validate-profiles.mjs
      - run: node --test scripts/validate-profiles.test.mjs scripts/import-profile.test.mjs
