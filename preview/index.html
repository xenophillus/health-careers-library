<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Career Previews — Health Careers Library</title>
<link rel="stylesheet" href="./styles.css">
<style>
.preview-banner{padding:.9rem 1rem;background:#fff3d6;color:#4c3600;border-bottom:2px solid #e8ae3b;text-align:center;font-weight:700}
.preview-head{margin:2rem auto 1rem}.preview-head h1{margin:.4rem 0}.preview-layout{display:grid;grid-template-columns:minmax(210px,290px) minmax(0,1fr);gap:1.25rem;margin:1.3rem auto 2rem}
.preview-menu{display:flex;flex-direction:column;gap:.35rem}.preview-menu button{padding:.7rem;text-align:left;border:1px solid #d1d8dd;border-radius:7px;background:transparent;color:inherit;cursor:pointer}.preview-menu button[aria-current="true"]{border-color:#177d80;background:#d7f1ec;font-weight:bold;color:#123c3e}
.preview-content{min-width:0}.preview-content p{line-height:1.7}.preview-content a{overflow-wrap:anywhere}.preview-selector{padding:.6rem;max-width:100%;width:100%;margin:.3rem 0}.preview-meta{color:#58666c}.preview-error{padding:1rem;border:1px solid #b44;border-radius:8px}
@media(max-width:750px){.preview-layout{grid-template-columns:1fr}.preview-menu{max-height:220px;overflow:auto}}
@media print{.preview-banner,.preview-menu,.preview-selector,.preview-select-label{display:none}.preview-layout{display:block}}
</style>
</head>
<body>
<div class="preview-banner">EDITORIAL DRAFT — NOT VERIFIED OR APPROVED FOR PUBLICATION</div>
<main class="wrap profile">
<header class="preview-head">
  <span class="tag">Editorial review</span>
  <h1 id="career-title">Career draft previews</h1>
  <p class="intro">Review complete career profiles imported from the editorial spreadsheet.</p>
  <label class="preview-select-label" for="career-select"><strong>Choose a career draft</strong></label>
  <select class="preview-selector" id="career-select" aria-label="Choose a career draft"></select>
  <p class="preview-meta" id="career-meta">These drafts are not part of the public career library.</p>
</header>
<div class="preview-layout">
  <nav class="preview-menu panel" id="section-menu" aria-label="Career article sections"></nav>
  <article class="profileCard content preview-content" id="section-content" aria-live="polite"></article>
</div>
</main>
<script type="module">
import {draftProfiles} from './drafts/manifest.js';
const selector=document.getElementById('career-select');
const menu=document.getElementById('section-menu');
const content=document.getElementById('section-content');
const title=document.getElementById('career-title');
const meta=document.getElementById('career-meta');
const lookup=new Map(draftProfiles.map(x=>[x.id,x]));
let revision=0;
function selectSection(sections,index){
 const selected=sections[index];if(!selected)return;
 content.replaceChildren();
 const heading=document.createElement('h2');heading.textContent=selected.name;
 const body=document.createElement('div');body.className='preview-body';body.innerHTML=selected.html;
 content.append(heading,body);
 [...menu.children].forEach((button,i)=>button.setAttribute('aria-current',String(i===index)));
}
async function selectCareer(id){
 const draft=lookup.get(id);if(!draft)return;
 const current=++revision;
 menu.replaceChildren();content.textContent='Loading draft…';
 title.textContent=draft.title;meta.textContent='Editorial status: '+draft.status+' · Not approved for publication';
 selector.value=id;
 const url=new URL(location.href);url.searchParams.set('career',id);history.replaceState(null,'',url);
 try{
  const module=await import('./drafts/'+encodeURIComponent(id)+'.js');
  if(current!==revision)return;
  if(!Array.isArray(module.sections)||module.sections.length!==14)throw Error('Expected 14 career sections.');
  const sections=module.sections;
  sections.forEach((section,i)=>{
   const button=document.createElement('button');button.type='button';
   button.textContent=(i+1)+'. '+section.name;
   button.addEventListener('click',()=>selectSection(sections,i));
   menu.appendChild(button);
  });
  selectSection(sections,0);
 }catch(error){if(current!==revision)return;content.replaceChildren();const message=document.createElement('p');message.className='preview-error';message.textContent='Unable to load this draft. Check the generated module and manifest.';content.append(message);console.error(error);}
}
for(const draft of draftProfiles){const option=document.createElement('option');option.value=draft.id;option.textContent=draft.title;selector.appendChild(option);}
selector.addEventListener('change',()=>selectCareer(selector.value));
const desired=new URLSearchParams(location.search).get('career');
if(draftProfiles.length)selectCareer(lookup.has(desired)?desired:draftProfiles[0].id);
else{selector.disabled=true;content.textContent='No complete unapproved career drafts available yet.';}
</script>
</body></html>
