let state={page:'home',id:null,section:'overview',query:'',path:'all',yMin:0,yMax:15,sMin:0,sMax:250000,sort:'az',filterOpen:false};let favorites=[];try{favorites=JSON.parse(localStorage.getItem('hcl-favorites')||'[]');if(!Array.isArray(favorites))favorites=[]}catch(e){}const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function money(n){return '$'+Number(n).toLocaleString('en-US')}function saveFav(){try{localStorage.setItem('hcl-favorites',JSON.stringify(favorites))}catch(e){}setCount()}function setCount(){const x=$('favCount');if(x)x.textContent=favorites.length}function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];saveFav();render()}function route(page,id){state.page=page;state.id=id||null;state.section='overview';render();window.scrollTo({top:0,behavior:'instant'});try{location.hash=page+(id?'/'+id:'')}catch(e){}}function navActive(){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('current',x.dataset.nav===state.page));setCount()}
function home(){return `<div class="wrap"><section class="hero"><div><div class="eyebrow">Your future in health & science</div><h1>Explore what<br><em>you could become.</em></h1><p class="lede">From caring for animals to developing life-changing technology, there's a whole world of careers to discover. Find the paths that spark your curiosity.</p><div class="actions"><button class="btn" onclick="route('library')">Explore careers ↗</button><button class="btn secondary" onclick="alert('Coming in Phase 2: an adaptive self-assessment that recommends careers based on your interests and preferences.')">✨ Find my match</button></div><p class="footnote">Explore sample profiles · Save favorites · No account needed</p></div><div class="herovisual" aria-hidden="true"><div class="orbit"><div class="center">🩺<div style="font-size:12px;font-weight:800;margin-top:-25px">YOUR PATH</div></div></div><div class="float one">🐾 Animal health</div><div class="float two">🔬 Discovery</div><div class="float three">⚙️ Technology</div></div></section><section class="section"><div class="sectionhead"><div><div class="eyebrow">Made for curious minds</div><h2>Many paths. One place to explore.</h2><p>Follow what interests you and see where it leads.</p></div></div><div class="featuregrid"><div class="feature"><div class="symbol">🔎</div><h3>Search & discover</h3><p>Browse careers and filter by schooling, salary and health science pathway.</p></div><div class="feature"><div class="symbol">💚</div><h3>Save what inspires you</h3><p>Favorite interesting careers and return to them as you explore.</p></div><div class="feature"><div class="symbol">🧭</div><h3>Go beyond the title</h3><p>Learn what professionals do, where they work and how they prepare for their careers.</p></div></div></section><section class="section"><div class="sectionhead"><div><div class="eyebrow">A few starting points</div><h2>Careers worth exploring</h2></div><button class="btn secondary small" onclick="route('library')">See all →</button></div><div class="cards">${[careers[0],careers[2],careers[9],careers[11]].map(card).join('')}</div></section></div>`}
function card(c){const fav=favorites.includes(c.id);return `<article class="careerCard"><div class="cardtop"><div class="careericon" aria-hidden="true">${c.icon}</div><button class="heart ${fav?'active':''}" onclick="toggleFav('${c.id}')" aria-label="${fav?'Remove':'Add'} ${esc(c.name)} ${fav?'from':'to'} favorites">${fav?'♥':'♡'}</button></div><span class="tag">${esc(c.path)}</span><h3>${esc(c.name)}</h3><div class="description">${esc(c.desc)}</div><div class="stats"><span class="stat">🎓 ~${c.years} years*</span><span class="stat">💵 ${money(c.salary)}*</span></div><div class="cardfoot"><span style="font-size:11px;color:var(--muted)">${esc(c.tags[0])}</span><button class="linkbtn" onclick="route('profile','${c.id}')">View profile ↗</button></div></article>`}
function filtered(){let res=careers.filter(c=>(state.page!=='favorites'||favorites.includes(c.id))&&(!state.query||[c.name,c.path,c.desc,...c.tags].join(' ').toLowerCase().includes(state.query.toLowerCase()))&&(state.path==='all'||c.path===state.path)&&c.years>=state.yMin&&c.years<=state.yMax&&c.salary>=state.sMin&&c.salary<=state.sMax);if(state.sort==='salary')res.sort((a,b)=>b.salary-a.salary);else if(state.sort==='education')res.sort((a,b)=>a.years-b.years||b.salary-a.salary);else res.sort((a,b)=>a.name.localeCompare(b.name));return res}
function library(){const paths=[...new Set(careers.map(x=>x.path))].sort();return `<div class="wrap directory"><div class="eyebrow">Discover your next possibility</div><h1 class="pagetitle">${state.page==='favorites'?'My favorite careers':'Explore health careers'}</h1><p class="subhead">${state.page==='favorites'?'Your personal shortlist, saved in this browser.':'Search careers, adjust the filters, and discover opportunities you might not expect.'}</p><div class="dirlayout"><aside><button class="btn secondary mobileFilter" onclick="state.filterOpen=!state.filterOpen;render()">⚙ Filters ${state.filterOpen?'−':'+'}</button><div class="panel filters ${state.filterOpen?'open':''}"><div class="filterhead"><h3>Refine results</h3><button class="clear" onclick="resetFilters()">Reset</button></div><div class="group"><label>Education length</label><span class="rangevalue">${state.yMin}–${state.yMax} years</span><div class="duals"><div class="mini"><label for="ymin">Minimum</label><input id="ymin" type="range" min="0" max="15" value="${state.yMin}" oninput="updateRange('yMin',this.value)"></div><div class="mini"><label for="ymax">Maximum</label><input id="ymax" type="range" min="0" max="15" value="${state.yMax}" oninput="updateRange('yMax',this.value)"></div></div></div><div class="group"><label>Illustrative salary range</label><span class="rangevalue">${money(state.sMin)}–${money(state.sMax)}</span><div class="duals"><div class="mini"><label for="smin">Minimum</label><input id="smin" type="range" min="0" max="250000" step="5000" value="${state.sMin}" oninput="updateRange('sMin',this.value)"></div><div class="mini"><label for="smax">Maximum</label><input id="smax" type="range" min="0" max="250000" step="5000" value="${state.sMax}" oninput="updateRange('sMax',this.value)"></div></div></div><div class="group"><label for="path">Health science pathway</label><select id="path" onchange="state.path=this.value;render()"><option value="all">All pathways</option>${paths.map(p=>`<option value="${esc(p)}" ${p===state.path?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="notice">* Training durations and salaries are illustrative examples for interface testing. They must be researched and verified before this site is used as a student reference.</div></div></aside><div><div class="searchrow"><input class="searchbox" id="search" type="search" aria-label="Search careers" placeholder="Search careers, skills or interests…" value="${esc(state.query)}" oninput="state.query=this.value;renderResults()"></div><div id="results"></div></div></div></div>`}
function resultMarkup(){const res=filtered();return `<div class="resulthead"><h3>${res.length} career${res.length===1?'':'s'} found</h3><select aria-label="Sort careers" onchange="state.sort=this.value;renderResults()"><option value="az" ${state.sort==='az'?'selected':''}>Alphabetical</option><option value="salary" ${state.sort==='salary'?'selected':''}>Highest sample salary</option><option value="education" ${state.sort==='education'?'selected':''}>Shortest sample schooling</option></select></div>${res.length?`<div class="cards">${res.map(card).join('')}</div>`:`<div class="empty"><div style="font-size:31px">🔎</div><h3>No careers found</h3><p>Try widening your ranges or changing your search.</p><button class="btn secondary small" onclick="resetFilters()">Clear filters</button></div>`}<div class="footnote">This is a demonstration with ${careers.length} sample careers. The full library will expand using the NCHSE health science pathways and verified occupational data.</div>`}
function renderResults(){const r=$('results');if(r)r.innerHTML=resultMarkup();document.querySelectorAll('.rangevalue').forEach((e,i)=>e.textContent=i===0?`${state.yMin}–${state.yMax} years`:`${money(state.sMin)}–${money(state.sMax)}`)}function updateRange(which,value){state[which]=Number(value);if(state.yMin>state.yMax){if(which==='yMin')state.yMax=state.yMin;else state.yMin=state.yMax}if(state.sMin>state.sMax){if(which==='sMin')state.sMax=state.sMin;else state.sMin=state.sMax}for(const k of ['yMin','yMax','sMin','sMax']){const input=$({yMin:'ymin',yMax:'ymax',sMin:'smin',sMax:'smax'}[k]);if(input)input.value=state[k]}renderResults()}
function resetFilters(){Object.assign(state,{query:'',path:'all',yMin:0,yMax:15,sMin:0,sMax:250000,sort:'az'});render()}
function profile(){if(state.id==='sonographer')return sonographerProfile();const c=careers.find(x=>x.id===state.id);if(!c)return library();const active=sections.find(s=>s[0]===state.section)||sections[0];let html='';switch(active[0]){case'overview':html=`<p>${esc(c.desc)}</p><p>Typical workplaces include ${esc(c.work.charAt(0).toLowerCase()+c.work.slice(1))}</p><h3>What makes this career interesting?</h3><p>${esc(c.qualities)}</p>`;break;case'duties':html='<ul>'+c.duties.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';break;case'qualities':html=`<p>${esc(c.qualities)}</p>`;break;case'work':html=`<p>${esc(c.work)}</p>`;break;case'education':html=`<p>${esc(c.edu)}</p><p><strong>Illustrative years of training:</strong> approximately ${c.years}. Actual routes vary.</p>`;break;case'requirements':html=`<p>${esc(c.requirements)}</p>`;break;case'resources':html=`<p>For reliable research, consult the <a style="color:var(--teal);text-decoration:underline" target="_blank" rel="noopener" href="https://www.bls.gov/ooh/">Occupational Outlook Handbook</a> and <a style="color:var(--teal);text-decoration:underline" target="_blank" rel="noopener" href="https://www.onetonline.org/">O*NET OnLine</a>. Career-specific professional organizations and licensing boards will be added in the complete library.</p>`;break}return `<div class="wrap profile"><button class="back" onclick="route('library')">← Back to career library</button><div class="profilehead"><div><span class="tag">${esc(c.path)}</span><h1>${c.icon} ${esc(c.name)}</h1><p class="intro">${esc(c.desc)}</p><div class="stats">${c.tags.map(x=>`<span class="stat">${esc(x)}</span>`).join('')}</div></div><div class="actions"><button class="btn small ${favorites.includes(c.id)?'secondary':''}" onclick="toggleFav('${c.id}')">${favorites.includes(c.id)?'♥ Saved to favorites':'♡ Add to favorites'}</button><button class="btn secondary small" onclick="window.print()">⎙ Print profile</button></div></div><div class="facts"><div class="fact"><label>Schooling*</label><b>~${c.years} years</b></div><div class="fact"><label>Annual salary*</label><b>${money(c.salary)}</b></div><div class="fact"><label>Pathway</label><b style="font-size:13px">${esc(c.path)}</b></div><div class="fact"><label>Career focus</label><b style="font-size:13px">${esc(c.tags.join(' · '))}</b></div></div><div class="profilegrid"><nav class="panel menu" aria-label="Career information sections">${sections.map(s=>`<button class="${active[0]===s[0]?'active':''}" onclick="state.section='${s[0]}';render();">${s[1]}</button>`).join('')}</nav><article class="profileCard content"><div class="eyebrow">Career information</div><h2>${active[1]}</h2>${html}</article><aside class="profileCard related"><h3>Discover related careers</h3>${c.related.map(id=>careers.find(x=>x.id===id)).filter(Boolean).map(x=>`<button onclick="route('profile','${x.id}')">${x.icon} ${esc(x.name)} ↗</button>`).join('')}</aside></div><div class="notice">* This prototype uses illustrative salary and education figures and abbreviated career information. Content is not yet verified for student-facing publication. Information varies by state, specialty, and training route.</div></div>`}

const sonographerSections=[{"id": "sonosec1", "name": "Career Overview", "html": "<p>Diagnostic medical sonographers are allied health professionals trained to create diagnostic images using ultrasound. Ultrasound equipment sends high-frequency sound waves into the body through a handheld device called a <strong>transducer</strong>. Echoes returning from tissues are converted into images displayed on a monitor. Some ultrasound techniques also provide information about motion and blood flow.</p>\n<p>Because diagnostic ultrasound uses sound waves rather than ionizing radiation, it differs from imaging methods such as conventional X-rays and computed tomography (CT). Like every medical technology, however, ultrasound must be used appropriately by trained personnel and according to professional safety practices.</p>\n<p>Sonographers work closely with patients and members of the healthcare team. They need to know how to obtain accurate images, recognize when an examination may require additional attention within established protocols, and communicate technical findings. A sonographer's observations can be important, but final interpretation and diagnosis are ordinarily the responsibility of a physician or another authorized interpreting professional.</p>\n<p>The general job title includes several areas of practice. For example, one sonographer may concentrate on abdominal imaging, while another examines pregnancy-related anatomy, the heart, or vascular circulation. Training and credentials can differ by specialty.</p>\n"}, {"id": "sonosec2", "name": "Duties and Responsibilities", "html": "<p>An examination begins before the transducer touches the patient. The sonographer reviews the imaging order, confirms patient identity according to facility procedures, obtains relevant clinical history, and prepares the examination area. They explain what will happen, address questions within their professional role, protect privacy, and help the patient into an appropriate position.</p>\n<p>During the scan, the sonographer applies ultrasound gel, positions the transducer, and changes machine settings to obtain useful images. This requires knowledge of normal anatomy, spatial relationships among structures, and the appearance of possible abnormalities. The sonographer may take measurements, record images or video clips, and use techniques that display blood flow. The exact images and measurements depend on the type of examination and the facility's protocol.</p>\n<p>The sonographer continuously evaluates image quality. A poor image can result from positioning, movement, equipment settings, or technical limitations. They may adjust their approach, ask the patient to change position or breathing, or consult with a supervising or interpreting professional when findings require attention.</p>\n<p>After the examination, the sonographer labels and stores images, prepares technical documentation, cleans equipment, follows infection-prevention practices, and prepares for the next patient. In some settings sonographers assist physicians during image-guided procedures. They also participate in quality assurance, equipment checks, continuing education, and patient safety activities.</p>\n<h3>Ten specific job tasks</h3>\n<ol>\n<li>Confirm the patient's identity and match the requested examination with the imaging order.</li>\n<li>Obtain and document relevant symptoms, medical history, and previous imaging information.</li>\n<li>Explain the examination, answer procedure-related questions, and protect patient privacy.</li>\n<li>Position the patient and select an appropriate transducer and scanning technique.</li>\n<li>Adjust gain, depth, focal zones, and other ultrasound settings to improve image quality.</li>\n<li>Identify anatomical structures and obtain the required images in multiple planes.</li>\n<li>Measure structures and, when indicated, assess blood flow with Doppler techniques.</li>\n<li>Recognize technical limitations or unexpected observations and follow protocols for communicating concerns.</li>\n<li>Label, save, and organize images and complete the technical worksheet or exam documentation.</li>\n<li>Clean and disinfect transducers and examination areas, check equipment readiness, and observe infection-prevention standards.</li>\n</ol>\n<p>The precise scope of practice depends on credentials, setting, employer policies, and applicable law. Sonographers do not generally issue the final diagnostic interpretation. These tasks are adapted and synthesized from the BLS occupational description and O*NET task inventory [1, 2].</p>\n"}, {"id": "sonosec3", "name": "A Day in the Life", "html": "<p>Consider a sonographer working in a hospital imaging department. At the start of a shift, they review the schedule and prepare the ultrasound machine and examination room. One patient may be scheduled for an abdominal study because of pain. Another may need a vascular study to investigate circulation. Later, a clinician may request an urgent bedside scan for a patient who cannot be moved safely to the imaging department.</p>\n<p>Each examination presents different technical and interpersonal challenges. Some patients can easily follow instructions, while others may be in pain, anxious, or unable to change positions. The sonographer needs to adapt, remain attentive, and preserve the patient's dignity while obtaining the necessary diagnostic information.</p>\n<p>When an examination is complete, the images are made available for interpretation. The sonographer documents technical information and communicates important concerns through the appropriate clinical channels. Depending on the workplace, the shift may include routine appointments, urgent requests, or collaboration with specialists during procedures.</p>\n<p>This is an <strong>illustrative day</strong>, not a universal schedule. Outpatient imaging centers may have comparatively predictable appointments; hospitals may operate around the clock and handle more urgent examinations.</p>\n"}, {"id": "sonosec4", "name": "Work Environment and Schedule", "html": "<p>Sonographers are employed by hospitals, physician offices, outpatient care centers, and medical or diagnostic laboratories. They may work in dedicated ultrasound rooms, specialty clinics, emergency departments, patient rooms, or other clinical areas. Some travel between facilities or bring portable ultrasound equipment to patients.</p>\n<p>Most work full time. Hospital staffing can include early mornings, evenings, weekends, overnight shifts, holidays, or on-call responsibilities. Schedules vary substantially among employers and specialties. Outpatient appointments may be more predictable, although that cannot be assumed for every position.</p>\n<p>The work is collaborative. Sonographers interact with patients and may coordinate with radiologists, cardiologists, obstetricians, nurses, medical assistants, and other team members. Because clinical information is sensitive, accurate documentation, confidentiality, and respectful communication are everyday responsibilities.</p>\n"}, {"id": "sonosec5", "name": "Skills, Knowledge, and Personal Qualities", "html": "<p>Successful sonography requires a blend of scientific understanding, technical judgment, manual skills, and interpersonal ability. Anatomy and physiology are fundamental: an image is only useful when the operator understands the structures being examined. Knowledge of ultrasound physics helps the sonographer select appropriate settings, reduce image artifacts, and understand the equipment's limitations.</p>\n<p>Attention to detail is central to the role. Sonographers must recognize differences among images, follow examination protocols, and document accurately. They also need hand-eye coordination to manipulate the transducer while observing the screen. Problem-solving is especially important when patient positioning, anatomy, or technical limitations make an examination difficult.</p>\n<p>Communication and empathy matter because patients may be uncomfortable or worried about possible findings. The sonographer should explain the procedure clearly and avoid offering an unauthorized diagnosis or premature reassurance about results.</p>\n<p><strong>Helpful strengths include:</strong> scientific curiosity, visual pattern recognition, careful documentation, comfort learning technology, patience, adaptable problem-solving, teamwork, and a commitment to patient safety. These are skills that can be developed through education and practice; students do not have to be naturally strong in every area before considering the career.</p>\n"}, {"id": "sonosec6", "name": "Physical and Emotional Demands", "html": "<p>Sonographers often spend substantial time sitting or standing near patients, reaching across examination tables, using hand controls, and maintaining pressure with the transducer. Some examinations require assistance with positioning or moving patients, while others are performed at a bedside in less-than-ideal spaces.</p>\n<p>Repeated scanning motions and awkward postures can contribute to <strong>work-related musculoskeletal disorders</strong>, including discomfort and injury involving the shoulder, neck, wrist, hand, or back. Professional guidance emphasizes adjustable equipment, neutral working positions, reasonable scheduling, and recovery breaks. Employers also have responsibilities for safe equipment and working conditions.</p>\n<p>Depending on the specialty, sonographers may encounter blood, bodily fluids, infectious patients, invasive procedures, serious diagnoses, or emotionally difficult situations. Routine noninvasive ultrasound does not necessarily involve exposure to blood. Students considering this career should distinguish the everyday demands of their preferred specialty from occasional or specialized clinical situations.</p>\n<p>Patient care can also be emotionally demanding. A sonographer may notice a concerning image but must follow appropriate communication procedures rather than independently disclose a diagnosis. Professional boundaries and support from the healthcare team are important.</p>\n"}, {"id": "sonosec7", "name": "Education and Training", "html": "<h3>Preparing in high school</h3>\n<p>Helpful preparation includes biology, anatomy and physiology, algebra, physics, health science, and communication. Strong grades may help with admission, but no single high school course list guarantees admission. Students should examine each program's published prerequisites rather than assume that all programs follow the same rules.</p>\n<h3>Common routes to the profession</h3>\n<p><strong>Associate degree:</strong> A sonography-focused associate degree is a common route. An associate program is often described as approximately two academic years <em>once admitted</em>, but prerequisite courses, waitlists, clinical placement schedules, and program structure can increase the total time between graduating high school and qualifying for employment.</p>\n<p><strong>Bachelor's degree:</strong> Some institutions offer bachelor's programs that typically take approximately four years of full-time college study, depending on prerequisites and transfer credits.</p>\n<p><strong>Postsecondary certificate:</strong> Certificate programs may serve applicants who already have related postsecondary education or healthcare credentials. Some are shorter than degree programs, but entry requirements and duration vary. A certificate is not automatically a direct-from-high-school shortcut.</p>\n<h3>Coursework and clinical learning</h3>\n<p>Typical topics include anatomy and physiology, medical terminology, patient care, ultrasound physics and instrumentation, sectional anatomy, abdominal and pelvic sonography, relevant pathology, imaging protocols, and ethical practice. Supervised clinical education is essential: students practice scanning, positioning, communication, image documentation, infection control, and the safe use of equipment under supervision.</p>\n<h3>Program selection checklist</h3>\n<p class=\"rich-intro\">Compare these factors before selecting a program. Requirements vary by institution and credentialing route.</p><div class=\"hcl-checklist\"><div class=\"hcl-checkitem\"><span aria-hidden=\"true\" class=\"checkicon\">🎓</span><div><strong>Credential awarded</strong><p>Associate degree, bachelor’s degree, or certificate?</p></div></div><div class=\"hcl-checkitem\"><span aria-hidden=\"true\" class=\"checkicon\">📚</span><div><strong>Admission prerequisites</strong><p>Which courses and other qualifications are required?</p></div></div><div class=\"hcl-checkitem\"><span aria-hidden=\"true\" class=\"checkicon\">⏱</span><div><strong>Time to completion</strong><p>Include prerequisites, program length, and clinical placement.</p></div></div><div class=\"hcl-checkitem\"><span aria-hidden=\"true\" class=\"checkicon\">💵</span><div><strong>Tuition and fees</strong><p>Estimate tuition, books, equipment, and clinical expenses.</p></div></div><div class=\"hcl-checkitem\"><span aria-hidden=\"true\" class=\"checkicon\">🏥</span><div><strong>Clinical placements</strong><p>Where and how will supervised clinical training take place?</p></div></div><div class=\"hcl-checkitem\"><span aria-hidden=\"true\" class=\"checkicon\">🔎</span><div><strong>Specialty opportunities</strong><p>Which ultrasound areas and experiences are available?</p></div></div><div class=\"hcl-checkitem\"><span aria-hidden=\"true\" class=\"checkicon\">✅</span><div><strong>Accreditation and exam eligibility</strong><p>Verify program accreditation and credentialing exam routes.</p></div></div></div><aside class=\"hcl-source-card\"><strong>Explore accredited programs</strong><p>The Commission on Accreditation of Allied Health Education Programs (CAAHEP) provides a searchable program directory. Check program-specific examination eligibility with the applicable credentialing organization.</p><a href=\"https://www.caahep.org/students/find-an-accredited-program\" rel=\"noopener noreferrer\" target=\"_blank\">Search CAAHEP programs ↗</a> <span>[4, 5]</span></aside>\n<h3>Typical Educational Pathway</h3>\n<p class=\"rich-intro\">This example shows one possible sequence. Each program and credentialing route may differ.</p><div class=\"hcl-steps\"><div class=\"hcl-step\"><span class=\"step-number\">1</span><h4>High school preparation</h4><p>Build foundations in biology, anatomy, mathematics, physics, and communication.</p></div><div class=\"hcl-step\"><span class=\"step-number\">2</span><h4>Meet admission prerequisites</h4><p>Complete the courses and requirements of your selected program.</p></div><div class=\"hcl-step\"><span class=\"step-number\">3</span><h4>Complete professional education</h4><p>Follow an eligible degree or certificate route and complete supervised clinical learning.</p></div><div class=\"hcl-step\"><span class=\"step-number\">4</span><h4>Confirm examination eligibility</h4><p>Check the current prerequisites for relevant professional credentials.</p></div><div class=\"hcl-step\"><span class=\"step-number\">5</span><h4>Earn appropriate credentials</h4><p>Complete required examinations and meet the credentials sought by employers.</p></div><div class=\"hcl-step\"><span class=\"step-number\">6</span><h4>Begin practice and keep learning</h4><p>Apply for employment and maintain credentials and competence through continuing education.</p></div></div><aside class=\"hcl-note\"><strong>How long does it take?</strong> A common sonography associate-degree program may take about two years after admission. Prerequisites, clinical schedules, and alternate pathways can change the total time.</aside>\n\n"}, {"id": "sonosec8", "name": "Certification and Licensure", "html": "<p>Professional credentials demonstrate that a sonographer has met defined knowledge and examination requirements. One widely recognized credential is <strong>Registered Diagnostic Medical Sonographer (RDMS)</strong>, administered by the American Registry for Diagnostic Medical Sonography (ARDMS) within Inteleos.</p>\n<p>The RDMS pathway generally requires successful completion of the <strong>Sonography Principles and Instrumentation (SPI)</strong> examination and a qualifying specialty examination, together with eligibility prerequisites. Specialty examinations include areas such as abdomen and obstetrics and gynecology. Other sonography credentials cover specific professional practice areas such as vascular or cardiac imaging.</p>\n<p>Education, experience, certification, employer hiring standards, and state licensing requirements are related but not identical. Some employers require professional certification; legal licensing requirements vary by jurisdiction. Because eligibility rules can change, students should consult the credentialing organization's current prerequisites before selecting an educational program or assuming they qualify for an exam.</p>\n<p>Professional certification is also associated with ongoing requirements to maintain credentials and remain current with developments in sonography.</p>\n"}, {"id": "sonosec9", "name": "Salary, Entry-Level Earnings, and Job Outlook", "html": "<h3>What is an entry-level salary?</h3>\n<p>An <strong>entry-level salary</strong> is the compensation actually offered to a new hire or professional early in a career. Government occupational wage tables generally report the wages of <em>all surveyed workers</em>, not a separate verified cohort of first-year employees. For this reason, the <strong>10th-percentile wage is a useful low-wage benchmark, but it must not be labeled a guaranteed starting salary</strong>. Students researching a specific first job should also examine dated local job postings and employer salary schedules when available.</p>\n<h3>U.S. and Kansas wages, May 2025</h3>\n<p>The following are published BLS Occupational Employment and Wage Statistics estimates, presented through the U.S. Department of Labor's CareerOneStop Salary Finder [1, 7]. The low and high columns correspond to the 10th and 90th percentiles, not a formal entry-level or seniority classification.</p>\n<div aria-label=\"Scrollable occupational wage comparison\" class=\"hcl-table-scroll\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>Area</th>\n<th style=\"text-align:right\">Lower wage (10th percentile)</th>\n<th style=\"text-align:right\">Median wage</th>\n<th style=\"text-align:right\">Upper wage (90th percentile)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>United States</strong></td>\n<td style=\"text-align:right\">$67,820/year</td>\n<td style=\"text-align:right\">$96,590/year</td>\n<td style=\"text-align:right\">$129,370/year</td>\n</tr>\n<tr>\n<td><strong>Kansas</strong></td>\n<td style=\"text-align:right\">$72,420/year</td>\n<td style=\"text-align:right\">$96,310/year</td>\n<td style=\"text-align:right\">$112,520/year</td>\n</tr>\n<tr>\n<td><strong>Kansas balance of state</strong></td>\n<td style=\"text-align:right\">$71,690/year</td>\n<td style=\"text-align:right\">$87,710/year</td>\n<td style=\"text-align:right\">$103,220/year</td>\n</tr>\n<tr>\n<td><strong>Wichita metro</strong></td>\n<td style=\"text-align:right\">$66,270/year</td>\n<td style=\"text-align:right\">$81,210/year</td>\n<td style=\"text-align:right\">$103,280/year</td>\n</tr>\n<tr>\n<td><strong>Kansas City, MO–KS metro</strong></td>\n<td style=\"text-align:right\">$77,070/year</td>\n<td style=\"text-align:right\">$100,450/year</td>\n<td style=\"text-align:right\">$123,300/year</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>The “Kansas balance of state” is a BLS geographic reporting category, not a Salina-specific wage estimate. Some metro areas do not have reportable estimates. Do not assume a regional figure describes a particular hospital's offers.</em></p>\n<h3>Annual, monthly, and hourly pay</h3>\n<p>The table below converts <strong>median annual</strong> figures to approximate <strong>gross monthly pay</strong> by dividing by 12. The hourly figures are the published hourly estimates, not independently inferred starting offers.</p>\n<div aria-label=\"Scrollable occupational wage comparison\" class=\"hcl-table-scroll\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>Area</th>\n<th style=\"text-align:right\">Median hourly (reported)</th>\n<th style=\"text-align:right\">Gross monthly equivalent (calculated)</th>\n<th style=\"text-align:right\">Median annual (reported)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>United States</td>\n<td style=\"text-align:right\">$46.44</td>\n<td style=\"text-align:right\">$8,049.17</td>\n<td style=\"text-align:right\">$96,590</td>\n</tr>\n<tr>\n<td>Kansas</td>\n<td style=\"text-align:right\">$46.30</td>\n<td style=\"text-align:right\">$8,025.83</td>\n<td style=\"text-align:right\">$96,310</td>\n</tr>\n<tr>\n<td>Kansas balance of state</td>\n<td style=\"text-align:right\">$42.17</td>\n<td style=\"text-align:right\">$7,309.17</td>\n<td style=\"text-align:right\">$87,710</td>\n</tr>\n<tr>\n<td>Wichita metro</td>\n<td style=\"text-align:right\">$39.04</td>\n<td style=\"text-align:right\">$6,767.50</td>\n<td style=\"text-align:right\">$81,210</td>\n</tr>\n</tbody>\n</table></div>\n<p>These are <strong>before taxes, benefit deductions, and other withholding</strong>. Hourly and annual estimates are independently tabulated and may not convert exactly due to estimation and rounding. Actual monthly pay also depends on paid hours, overtime, work schedule, and employer policies.</p>\n<h3>What affects compensation?</h3>\n<p>Geographic location, years of experience, specialty, multiple credentials, employer type, shift differentials, overtime, and supervisory responsibility can influence wages. BLS reports that median earnings differ among outpatient care centers, hospitals, physicians' offices, and medical/diagnostic laboratories [1]. Becoming a senior sonographer, educator, lead technologist, clinical specialist, or manager can expand responsibilities, but it does <strong>not</strong> guarantee a particular wage increase.</p>\n<h3>National vs. global wages</h3>\n<p>HOSA asks students to investigate local, national, and global pay. This profile documents <strong>verified U.S. and Kansas figures</strong>, but does not present a fabricated “global sonographer salary.” Pay in other countries depends on professional title, training standards, currency, cost of living, work hours, and the statistical method used. For a valid international comparison, students should select a specific country and cite an official labor or government source for that country's equivalent occupation and reporting year. Until that comparison is researched and verified, <strong>global compensation remains a research gap</strong>, rather than a number to fill in speculatively.</p>\n<h3>Employment outlook</h3>\n<p>BLS projects <strong>14% U.S. employment growth from 2025 to 2035</strong> for diagnostic medical sonographers, faster than average for all occupations, and approximately <strong>6,000 openings per year</strong> on average over the decade [1]. These are projections rather than job guarantees. Population aging, diagnostic imaging needs, and the use of ultrasound in multiple settings contribute to demand; local conditions still matter.</p>\n"}, {"id": "sonosec10", "name": "Specialties and Career Advancement", "html": "<p>Sonography encompasses several distinct areas. <strong>Abdominal sonography</strong> focuses on structures such as the liver, gallbladder, pancreas, kidneys, and other abdominal organs. <strong>Obstetric and gynecologic sonography</strong> includes imaging associated with pregnancy and reproductive anatomy. <strong>Vascular sonography</strong> examines blood vessels and circulation. <strong>Cardiac sonography</strong>, often called echocardiography, focuses on the heart. Additional practice areas include breast, pediatric, and other specialized ultrasound examinations.</p>\n<p>These specialties may involve different credentials, patient populations, examination techniques, and workplaces. Not every sonographer performs every type of examination; specialized training is often necessary.</p>\n<p>With experience and further preparation, professionals may move into senior clinical roles, education, clinical instruction, quality improvement, supervision, department management, or applications-specialist positions with ultrasound equipment manufacturers. Advancement depends on employer opportunities and the qualifications required for each role.</p>\n"}, {"id": "sonosec11", "name": "Benefits and Challenges of the Career", "html": "<p>Some aspects of a profession are rewards for one person and difficulties for another. This section provides <strong>five distinct potential benefits and five distinct challenges</strong> to support balanced research. Actual experiences depend on specialty, employer, scheduling, and the individual.</p>\n<div class=\"hcl-benefit-grid\"><section class=\"hcl-benefit-panel benefits\"><h3>Potential benefits</h3><ol>\n<li><strong>Meaningful contribution to diagnosis and treatment:</strong> Ultrasound images can assist clinicians in answering important questions about patient health.</li>\n<li><strong>Combination of technology and human interaction:</strong> Sonographers use sophisticated equipment while also working directly with patients.</li>\n<li><strong>Multiple specialty choices:</strong> Professionals may focus on abdominal, obstetric/gynecologic, breast, cardiac, vascular, pediatric, or other ultrasound practice areas, with appropriate training and credentials.</li>\n<li><strong>Variety of workplaces:</strong> Hospitals, physician offices, imaging facilities, and outpatient centers can offer different clinical environments.</li>\n<li><strong>Opportunities for learning and professional development:</strong> New imaging techniques, continuing education, advanced credentials, teaching, and leadership can provide avenues for professional growth.</li>\n<li><strong>Favorable national employment outlook:</strong> Current BLS projections indicate faster-than-average occupational growth; individual job prospects still vary.</li>\n</ol></section><section class=\"hcl-benefit-panel challenges\"><h3>Potential challenges</h3><ol>\n<li><strong>Musculoskeletal strain:</strong> Repetitive scanning, sustained pressure, patient positioning, and awkward postures can affect the shoulder, neck, back, wrist, and hand [6].</li>\n<li><strong>Emotional situations:</strong> Sonographers may scan patients who are frightened, seriously ill, or facing distressing medical possibilities.</li>\n<li><strong>Unpredictable hours in some settings:</strong> Hospital, urgent, or on-call roles may require evenings, nights, weekends, or holidays.</li>\n<li><strong>Technical and clinical responsibility:</strong> Missed images, incorrect labeling, or incomplete documentation can affect the diagnostic process; careful protocols and quality checks are essential.</li>\n<li><strong>Close patient contact and occupational exposure:</strong> Some specialties involve exposure to infectious illness, bodily fluids, or assistance with invasive procedures. Precautions and risks vary by setting.</li>\n<li><strong>Training and credential maintenance:</strong> Admission may be competitive, clinical rotations require substantial time, and ongoing professional education may be required.</li>\n</ol></section></div>\n\n\n\n<p><strong>Research interpretation:</strong> These are supported occupational considerations, not a universal ranking of what sonographers like or dislike. Students preparing a HOSA display should examine these claims, consider firsthand accounts where available, and explain the tradeoffs in their own words.</p>\n"}, {"id": "sonosec12", "name": "Career Connections and Related Occupations", "html": "<p>Sonographers contribute to clinical decisions by producing images that other healthcare professionals interpret and integrate with symptoms, examination findings, laboratory results, and medical history. Their work often connects imaging departments with emergency care, surgery, obstetrics, cardiology, and outpatient medicine.</p>\n<p>Students interested in sonography might also investigate <strong>radiologic technologist</strong>, <strong>magnetic resonance imaging technologist</strong>, <strong>cardiovascular technologist</strong>, <strong>respiratory therapist</strong>, and <strong>medical laboratory scientist</strong>. These careers overlap in scientific knowledge, technology, or patient care but differ in equipment, responsibilities, training, and working environments.</p>\n<p>The career exploration system should explain these differences rather than treating the professions as interchangeable.</p>\n"}, {"id": "sonosec13", "name": "Could This Career Interest You?", "html": "<p>Sonography may appeal to students who enjoy understanding the human body, using medical technology, solving visual problems, and communicating with patients. It often offers significant patient contact and hands-on technical work. Some specialties have more predictable routines than others; some require urgent or after-hours work.</p>\n<p>An interest-matching assessment might consider preferences for <strong>technology use</strong>, <strong>hands-on procedures</strong>, <strong>patient interaction</strong>, <strong>anatomy</strong>, <strong>visual pattern recognition</strong>, <strong>workplace pace</strong>, and <strong>education commitment</strong>. It should also let students explore the career even if one preference does not match perfectly. Physical requirements should be described factually, without treating a disability or accommodation need as an automatic exclusion.</p>\n"}, {"id": "sonosec14", "name": "Key Vocabulary", "html": "<ul class=\"hcl-glossary\">\n<li><strong>Sonography:</strong> Use of ultrasound technology to produce images for medical evaluation.</li>\n<li><strong>Transducer:</strong> Device that sends and receives ultrasound waves.</li>\n<li><strong>Ultrasound gel:</strong> Material that helps ultrasound waves travel between the transducer and skin.</li>\n<li><strong>Doppler ultrasound:</strong> Technique used to evaluate motion, especially blood flow.</li>\n<li><strong>Artifact:</strong> Image feature that does not accurately represent the underlying anatomy or that arises from the imaging process.</li>\n<li><strong>Echocardiography:</strong> Ultrasound examination of the heart.</li>\n<li><strong>Accreditation:</strong> External evaluation showing that an educational program meets specified standards.</li>\n<li><strong>Credentialing:</strong> Process of confirming that a professional meets defined qualifications or certification requirements.</li>\n<li><strong>Median wage:</strong> The middle wage of an earnings distribution, with half above and half below.</li>\n<li><strong>Ergonomics:</strong> Design of tasks, equipment, and work practices to support safe and effective movement and posture.</li>\n</ul>\n"}, {"id": "sonosec15", "name": "Bibliography & Sources", "html": "<p>References are formatted in an APA-style organizational-author format. Webpages that do not clearly specify a publication date are marked <strong>n.d.</strong>; check official pages for updates before using a reference in formal work.</p>\n<ol>\n<li><p>U.S. Bureau of Labor Statistics. (2026). <em>Diagnostic medical sonographers</em>. Occupational Outlook Handbook. <a href=\"https://www.bls.gov/ooh/healthcare/diagnostic-medical-sonographers.htm\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.bls.gov/ooh/healthcare/diagnostic-medical-sonographers.htm</a><br />\n<strong>Used for:</strong> occupational overview, typical education, salary (May 2025), work settings, and employment projection (2025–2035).</p>\n</li>\n<li><p>National Center for O<em>NET Development. (n.d.). *Diagnostic medical sonographers (29-2032.00).</em> O*NET OnLine. <a href=\"https://www.onetonline.org/link/summary/29-2032.00\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.onetonline.org/link/summary/29-2032.00</a><br />\n<strong>Used for:</strong> detailed job tasks, skills, activities, and work context.</p>\n</li>\n<li><p>Inteleos. (n.d.). <em>Registered Diagnostic Medical Sonographer (RDMS).</em> <a href=\"https://www.inteleos.org/certification/registered-diagnostic-medical-sonographer/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.inteleos.org/certification/registered-diagnostic-medical-sonographer/</a><br />\n<strong>Used for:</strong> RDMS credential, SPI and specialty exam structure, and examination prerequisites.</p>\n</li>\n<li><p>Commission on Accreditation of Allied Health Education Programs. (n.d.). <em>For students.</em> <a href=\"https://www.caahep.org/students/for-students\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.caahep.org/students/for-students</a><br />\n<strong>Used for:</strong> accreditation and how it relates to educational quality and credential eligibility.</p>\n</li>\n<li><p>Commission on Accreditation of Allied Health Education Programs. (n.d.). <em>Find an accredited program.</em> <a href=\"https://www.caahep.org/students/find-an-accredited-program\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.caahep.org/students/find-an-accredited-program</a><br />\n<strong>Used for:</strong> locating accredited educational pathways.</p>\n</li>\n<li><p>Society of Diagnostic Medical Sonography. (n.d.). <em>Work related musculoskeletal disorders and sonography.</em> <a href=\"https://www.sdms.org/resources/careers/work-related-musculoskeletal-disorders\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.sdms.org/resources/careers/work-related-musculoskeletal-disorders</a><br />\n<strong>Used for:</strong> physical demands, work-related injury risks, and ergonomic safety.</p>\n</li>\n<li><p>U.S. Department of Labor, Employment and Training Administration. (n.d.). <em>Salary Finder: Diagnostic medical sonographers in Kansas (2025 wages).</em> CareerOneStop. <a href=\"https://cloudfront.careeronestop.org/Toolkit/Wages/find-salary.aspx?dataview=table&amp;amp;keyword=Diagnostic+Medical+Sonographers&amp;amp;location=Kansas&amp;amp;soccode=292032\" target=\"_blank\" rel=\"noopener noreferrer\">https://cloudfront.careeronestop.org/Toolkit/Wages/find-salary.aspx?dataview=table&amp;amp;keyword=Diagnostic+Medical+Sonographers&amp;amp;location=Kansas&amp;amp;soccode=292032</a><br />\n<strong>Used for:</strong> regional and national wage percentiles; reported annual and hourly pay. Calculated monthly equivalents are explicitly labeled in the profile.</p>\n</li>\n<li><p>HOSA–Future Health Professionals. (2026). <em>Health Career Display: 2026–2027 competitive event guidelines.</em> User-provided competition document.<br />\n<strong>Used for:</strong> setting the research coverage requirements, not as a source for occupational facts.</p>\n</li>\n</ol>\n<p><strong>Publication note:</strong> This Health Careers Library profile is an original educational synthesis of the sources above. It is not a substitute for current program admission standards, credentialing eligibility rules, licensing requirements, or local employment data.</p>\n<hr />\n<h2>Appendix: HOSA Health Career Display Research Alignment (not part of the general career profile navigation)</h2>\n<table>\n<thead>\n<tr>\n  <th>Research criterion</th>\n  <th>Where to find support</th>\n  <th>What competitors still need to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Career overview</td>\n  <td>§1</td>\n  <td>Select, synthesize, and explain relevant details in original wording</td>\n</tr>\n<tr>\n  <td>Five or more specific tasks</td>\n  <td>§2</td>\n  <td>Choose and explain at least five tasks accurately</td>\n</tr>\n<tr>\n  <td>Education, courses, credentials, training time</td>\n  <td>§§7–8</td>\n  <td>Verify a particular program and professional eligibility route</td>\n</tr>\n<tr>\n  <td>Entry-level/local/national/global salary</td>\n  <td>§9</td>\n  <td>Investigate an actual entry-level offer and, if using a global comparison, obtain a credible country-specific figure</td>\n</tr>\n<tr>\n  <td>Five or more benefits/challenges</td>\n  <td>§11</td>\n  <td>Evaluate tradeoffs and support the claims chosen</td>\n</tr>\n<tr>\n  <td>Five or more additional career facts</td>\n  <td>§§3–6, 10, 12–14</td>\n  <td>Choose distinct relevant facts and explain them</td>\n</tr>\n<tr>\n  <td>Reference page</td>\n  <td>§15</td>\n  <td>Cite all actually consulted sources in a clear bibliography</td>\n</tr>\n<tr>\n  <td>Creativity and physical display</td>\n  <td>Not supplied by library</td>\n  <td>Develop original artwork, physical display, and explanatory outline</td>\n</tr>\n<tr>\n  <td>Presentation</td>\n  <td>Not supplied by library</td>\n  <td>Prepare and practice a clear, original five-minute team presentation</td>\n</tr>\n</tbody>\n</table>\n<p>The competition outline requires a title slide, career research slides, a description of creative/artistic impact, a photo of the completed board, references, and a combined PDF submission within its slide limits. The official 2026–2027 rules control; Kansas SLC requirements and deadlines must be checked with the advisor. The library is a <strong>research resource</strong>, not a pre-made HOSA entry.</p>\n"}];
function sonographerProfile(){
 const c=careers.find(x=>x.id==='sonographer');
 const current=sonographerSections.find(x=>x.id===state.section)||sonographerSections[0];
 const fav=favorites.includes(c.id);
 const menus=sonographerSections.map(s=>`<button class="${current.id===s.id?'active':''}" onclick="state.section='${s.id}';render();" aria-current="${current.id===s.id?'true':'false'}">${esc(s.name)}</button>`).join('');
 const allContent=sonographerSections.map(s=>`<section class="print-section"><h2>${esc(s.name)}</h2>${s.html}</section>`).join('');
 return `<div class="wrap profile sonographer-profile"><button class="back" onclick="route('library')">← Back to career library</button>
 <div class="profilehead"><div><span class="tag">Diagnostic Services</span><h1>🩻 Diagnostic Medical Sonographer</h1><p class="intro">Uses diagnostic ultrasound technology to create images of internal anatomy, support clinical decisions, and care for patients.</p><div class="stats"><span class="stat">Ultrasound technology</span><span class="stat">Patient care</span><span class="stat">Medical imaging</span></div></div><div class="actions"><button class="btn small ${fav?'secondary':''}" onclick="toggleFav('sonographer')">${fav?'♥ Saved to favorites':'♡ Add to favorites'}</button><button class="btn secondary small" onclick="window.print()">⎙ Print full profile</button></div></div>
 <div class="facts"><div class="fact"><label>US median annual pay</label><b>$96,590</b><small>May 2025</small></div><div class="fact"><label>Common entry route</label><b>Associate degree</b><small>Other pathways exist</small></div><div class="fact"><label>Projected US growth</label><b>14%</b><small>2025–2035</small></div><div class="fact"><label>Profile last researched</label><b>Oct 2026</b><small>Sources in bibliography</small></div></div>
 <div class="profilegrid"><nav class="panel menu" aria-label="Sonographer career sections">${menus}</nav><article class="profileCard content"><div class="eyebrow">Comprehensive career reference</div><h2>${esc(current.name)}</h2>${current.html}</article><aside class="profileCard related"><h3>Related careers</h3>${c.related.map(id=>careers.find(x=>x.id===id)).filter(Boolean).map(x=>`<button onclick="route('profile','${x.id}')">${x.icon} ${esc(x.name)} ↗</button>`).join('')}<p style="font-size:12px;color:var(--muted);line-height:1.6">Information is for educational research. Verify licensing, program admission and current salary details using cited sources.</p></aside></div>
 <div class="print-all">${allContent}</div><div class="notice">This comprehensive article is a sourced educational reference. Salaries and educational routes vary by location, employer and specialty. Other prototype careers still contain sample figures.</div></div>`;
}

function render(){const app=$('app');app.innerHTML=state.page==='home'?home():state.page==='profile'?profile():library();navActive();if(state.page==='library'||state.page==='favorites')renderResults()}const hash=location.hash.replace(/^#/,'').split('/');if(['home','library','favorites','profile'].includes(hash[0])){state.page=hash[0];state.id=hash[1]||null}render();window.addEventListener('hashchange',()=>{const h=location.hash.replace(/^#/,'').split('/');if(['home','library','favorites','profile'].includes(h[0])&&(h[0]!==state.page||h[1]!==state.id)){state.page=h[0];state.id=h[1]||null;render()}})
</script></body></html>
